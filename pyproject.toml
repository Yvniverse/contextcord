[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contextcord"
version = "0.6.2a1"
description = "Portable, source-aware engineering continuity for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.22,<5"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "docs/legal/CONTEXTCORD_PREVIOUS_MIT.txt", "docs/architecture/ARCHIFY_LICENSE.txt"]
authors = [{name = "ContextCord contributors"}]
keywords = ["coding-agent", "engineering-continuity", "agentops", "codex", "opencode", "qoder", "software-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7", "build>=1,<2", "setuptools>=77", "wheel>=0.43"]
jev = ["typesafe-sdk>=0.7,<1", "python-dotenv>=1,<2"]

[project.scripts]
contextcord = "contextcord.entrypoint:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextcord = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
