name: Product checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q
      - run: python -m compileall -q src scripts tests evaluation
      - run: python scripts/check_contracts.py
      - run: python scripts/check_product_surface.py
      - run: python scripts/check_readme_metrics.py
      - run: python evaluation/continuity/recompute.py --check
      - run: python evaluation/typed_decisions/recompute.py --check --replay
      - run: python scripts/mcp_smoke.py
      - run: python scripts/stage_public_release.py --destination .work/candidate --manifest .work/content-manifest.json
      - run: python scripts/check_public_release.py .work/candidate --manifest .work/content-manifest.json
      - run: python -m build
      - run: python scripts/check_distribution.py --dist dist
