name: Bug report
description: Report reproducible incorrect behavior in ContextCord
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the report. Remove secrets, private archive content, and credentials before submitting."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
      placeholder: "1. ...
2. ...
3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: ContextCord version/commit, OS, Python version, host name/version, and relevant MCP transport.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or receipts
      description: Paste only evidence that is safe to publish. Use SECURITY.md for vulnerabilities.
