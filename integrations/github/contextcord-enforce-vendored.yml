name: ContextCord Required Verify

on:
  pull_request:
  workflow_dispatch:

jobs:
  harness-required:
    runs-on: ubuntu-latest
    env:
      # A project-specific trusted download step MUST materialize the portable
      # closeout bundle at this path before the verification step below.
      CONTEXTCORD_BUNDLE: .contextcord/portable-closeout.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install reviewed vendored ContextCord wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find tools/contextcord -maxdepth 1 -name 'contextcord-*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install --no-deps "$wheel"

      - name: Validate project policy and exact current identity
        shell: bash
        run: |
          set -euo pipefail
          contextcord doctor
          contextcord identity
          contextcord release-identity || true

      # REQUIRED IN REAL REPOSITORIES:
      # Add a reviewed artifact-download step here. It should fetch the bundle
      # produced for this exact candidate by `contextcord bundle export`.
      # Do not create a new source commit merely to transport post-commit proof.

      - name: Require and verify portable closeout evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CONTEXTCORD_BUNDLE" || {
            echo "Required Portable Evidence Bundle missing: $CONTEXTCORD_BUNDLE" >&2
            echo "Configure a trusted post-commit artifact download step before enforcing this workflow." >&2
            exit 2
          }
          contextcord bundle verify --path "$CONTEXTCORD_BUNDLE"
          # Optional artifact materialization: contextcord bundle import --path "$CONTEXTCORD_BUNDLE"
          git fetch origin refs/notes/contextcord:refs/notes/contextcord 2>/dev/null || true
          # Local verify --ci requires the original live store; imported artifacts do not recreate it.
