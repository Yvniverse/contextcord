name: ContextCord Verify
description: Verify local closeout or a portable evidence bundle using the same open core.
inputs:
  repository:
    description: Checked-out repository directory
    default: '.'
  bundle:
    description: Optional portable bundle from a trusted artifact channel; otherwise verify local state
    default: ''
runs:
  using: composite
  steps:
    - name: Install core
      shell: bash
      env:
        CONTEXTCORD_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$CONTEXTCORD_ACTION_PATH"
    - name: Verify evidence
      shell: bash
      env:
        CONTEXTCORD_REPO: ${{ inputs.repository }}
        CONTEXTCORD_BUNDLE: ${{ inputs.bundle }}
      run: |
        set -euo pipefail
        if [ -n "$CONTEXTCORD_BUNDLE" ]; then
          contextcord --repo "$CONTEXTCORD_REPO" bundle verify --path "$CONTEXTCORD_BUNDLE"
        else
          contextcord --repo "$CONTEXTCORD_REPO" verify --ci
        fi
